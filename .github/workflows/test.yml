name: Test

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: enhanced

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Test web state and Markdown
        run: npm --prefix web test

      - name: Install Chromium
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Test the bundled browser UI
        run: npm --prefix web run test:browser

      - name: Run tests
        run: ./gradlew test

      # PR builds do not need the upstream signing secrets. Exercise R8 as well as tests.
      - name: Build minified APKs
        run: ./gradlew :app:assembleAlpha :app:assembleRelease

      - name: Verify web resources in minified APKs
        run: python3 scripts/check-web-apk.py web/dist app/build/outputs/apk/alpha/*.apk app/build/outputs/apk/release/*.apk

      - name: Sign disposable minified APK copies
        run: scripts/sign-smoke-apks.sh "$RUNNER_TEMP/minified-smoke" app/build/outputs/apk/alpha/app-x86_64-alpha-unsigned.apk app/build/outputs/apk/release/app-x86_64-release-unsigned.apk

      - name: Release build daemon memory before emulator startup
        run: ./gradlew --stop

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test minified services on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            python3 scripts/smoke-minified.py emulator-5554 "$RUNNER_TEMP/minified-smoke/alpha.apk" com.storyteller_f.feiya.alpha app/build/reports/minified-smoke/alpha
            python3 scripts/smoke-minified.py emulator-5554 "$RUNNER_TEMP/minified-smoke/release.apk" com.storyteller_f.feiya app/build/reports/minified-smoke/release

      - name: Upload minified smoke results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minified-smoke-results
          path: app/build/reports/minified-smoke/
          if-no-files-found: ignore
