name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - '*'
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        run: |
          mkdir -p app/build/signing
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/build/signing/signing_key.jks

      - name: Build APK
        run: ./gradlew ${{ startsWith(github.ref, 'refs/tags/') && 'assembleRelease' || 'assembleDaily' }}
        env:
          storyteller_f_sign_path: app/build/signing/signing_key.jks
          storyteller_f_sign_alias: ${{ secrets.ALIAS }}
          storyteller_f_sign_store_password: ${{ secrets.STORE_PASSWORD }}
          storyteller_f_sign_key_password: ${{ secrets.KEY_PASSWORD }}

      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Daily APK
          path: app/build/outputs/apk/daily/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref }}
          files: app/build/outputs/apk/release/*.apk
